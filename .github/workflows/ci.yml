name: CI

# Pushing a version tag, like v0.1.0, also drafts a GitHub release from
# the builds. Running it by hand on a branch is a dry run: the release is
# put together as an artifact instead. See docs/releasing.md.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Actions are pinned to commits, since a tag can be moved to other code,
# and Dependabot proposes updates. Checkouts keep no GitHub token, so
# nothing a build runs can use it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  test:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Release builds start clean: a cache can be filled by any branch.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      # Sync keeps its key in the desktop keychain. Test against a real one:
      # gnome-keyring on a private session bus.
      - name: Test the Linux keychain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus gnome-keyring libsecret-1-0
          dbus-run-session -- sh -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            GPAD_TEST_KEYCHAIN=1 flutter test test/sync/keychain_test.dart
          '

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    # Built on the oldest distribution we support. The binary takes its glibc
    # and GLib symbol versions from the build machine, so it runs there and on
    # anything newer. Built on 24.04, it fails to start on 22.04 or Debian 12.
    container: ubuntu:22.04
    steps:
      - name: Install desktop build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip xz-utils zip file jq dpkg-dev make \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Release builds start clean: a cache can be filled by any branch.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # GPad's Google sign-in client, for syncing through Drive. Google
      # treats a desktop app's client secret as public, so it ships in the
      # app; it lives in secrets only to stay out of the repo. Builds
      # without it (forks, say) ask for the person's own client instead.
      - name: Build
        env:
          GPAD_GOOGLE_CLIENT_ID: ${{ secrets.GPAD_GOOGLE_CLIENT_ID }}
          GPAD_GOOGLE_CLIENT_SECRET: ${{ secrets.GPAD_GOOGLE_CLIENT_SECRET }}
        run: >
          flutter build linux --release
          --dart-define=GPAD_GOOGLE_CLIENT_ID="$GPAD_GOOGLE_CLIENT_ID"
          --dart-define=GPAD_GOOGLE_CLIENT_SECRET="$GPAD_GOOGLE_CLIENT_SECRET"
      - name: Package .deb and AppImage
        run: linux/packaging/package.sh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gpad-linux-x64
          path: build/linux/x64/release/bundle
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gpad-linux-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gpad-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  smoke-linux:
    name: Launch on ${{ matrix.image }}
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:22.04, ubuntu:24.04, debian:12, fedora:latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gpad-linux-deb
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gpad-linux-appimage
          path: dist
      - name: Install and launch in a clean ${{ matrix.image }} container
        run: >
          docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }}
          sh linux/packaging/smoke_test.sh dist

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Release builds start clean: a cache can be filled by any branch.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # Sync's files, folder watching and Credential Manager behave
      # differently on Windows, so its tests run here too.
      - run: flutter test test/sync
      - name: Build
        env:
          GPAD_GOOGLE_CLIENT_ID: ${{ secrets.GPAD_GOOGLE_CLIENT_ID }}
          GPAD_GOOGLE_CLIENT_SECRET: ${{ secrets.GPAD_GOOGLE_CLIENT_SECRET }}
        shell: pwsh
        run: >
          flutter build windows --release
          "--dart-define=GPAD_GOOGLE_CLIENT_ID=$env:GPAD_GOOGLE_CLIENT_ID"
          "--dart-define=GPAD_GOOGLE_CLIENT_SECRET=$env:GPAD_GOOGLE_CLIENT_SECRET"
      # Flutter apps need the Visual C++ runtime, which many PCs (and locked-down
      # work machines) don't have. Shipping it next to gpad.exe keeps the
      # build portable: unzip and run, no installer or admin rights.
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item -Path "$env:WINDIR\System32\$dll" -Destination $release -ErrorAction Stop
          }
          Get-ChildItem $release -Filter *.dll | Format-Table Name, Length
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gpad-windows-x64
          path: build/windows/x64/runner/Release
          retention-days: 14

  release:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [smoke-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to draft the release
      id-token: write # to sign the build attestation
      attestations: write
    env:
      DRY_RUN: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only what is on main gets released, so every release went through
      # review and CI first.
      - name: Check the tag is on main
        if: env.DRY_RUN == 'false'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD ||
            { echo "::error::$GITHUB_REF_NAME isn't on main"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: builds
      # A dry run takes the tag the version in pubspec.yaml would have.
      - name: Put the downloads together
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$DRY_RUN" = true ]; then
            tag="v$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)"
          fi
          tool/prepare_release.sh "$tag" builds release notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.DRY_RUN == 'true'
        with:
          name: release-dry-run
          path: |
            release
            notes.md
          retention-days: 7
      # Lets anyone check a download was built here, from this tag:
      # gh attestation verify FILE --repo analogproblems/GOATPad
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.DRY_RUN == 'false'
        with:
          subject-path: release/*
      # A draft, which only the repository's maintainers see until one of
      # them publishes it.
      - name: Draft the release
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY"
          --draft --verify-tag
          --title "GPad ${GITHUB_REF_NAME#v}"
          --notes-file notes.md
